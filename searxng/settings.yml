# Minimal private SearXNG for Agent Workbench: JSON output on, no bot limiter (only your server talks to it).
use_default_settings: true
server:
  limiter: false
  public_instance: false
  # secret_key comes from the SEARXNG_SECRET environment variable
general:
  instance_name: "PrivacySearch"
  debug: false                  # Always set to false in production for security
  enable_metrics: true
search:
  formats:
    - html
    - json
engines:
  - name: google
    disabled: false
    weight: 1.5                 # Prioritizes Google results higher in aggregate lists
    
  - name: bing
    disabled: true

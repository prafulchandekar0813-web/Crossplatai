<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Admin</title>
<style>
:root { --bg:#f5f6f8; --card:#fff; --ink:#15181d; --mute:#667085; --line:#e4e7ec; --brand:#3b5bdb; --brand-ink:#fff; --bad:#c92a2a; --ok:#2b8a3e; --chip:#eef1f6; --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06); }
@media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --card:#181b21; --ink:#eceff4; --mute:#98a2b3; --line:#2a2f38; --brand:#7c93ff; --brand-ink:#0b0d12; --bad:#ff8787; --ok:#69db7c; --chip:#222732; --shadow:none; } }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
header.top { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
header.top h1 { font-size: 16px; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 3px 8px; border-radius: 99px; background: var(--chip); color: var(--mute); }
nav.tabs { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px 4px; scrollbar-width: none; }
nav.tabs button { flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 8px 14px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
nav.tabs button[aria-current="true"] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
nav.tabs .n { font-size: 12px; opacity: .75; }
main { max-width: 980px; margin: 0 auto; padding: 8px 16px 90px; }
.bar { display: flex; gap: 10px; align-items: center; margin: 12px 0; flex-wrap: wrap; }
.bar h2 { margin: 0; font-size: 20px; flex: 1; min-width: 120px; }
input[type=search], .f input, .f select, .f textarea { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
input[type=search] { max-width: 260px; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 10px 14px; cursor: pointer; min-height: 42px; }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); font-weight: 600; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .55; cursor: default; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.item { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; cursor: pointer; text-align: left; display: flex; flex-direction: column; padding: 0; }
.item .pic { aspect-ratio: 16/9; background: var(--chip); display: grid; place-items: center; color: var(--mute); font-size: 13px; overflow: hidden; }
.item .pic img, .item .pic video { width: 100%; height: 100%; object-fit: cover; }
.item .body { padding: 12px 14px; display: grid; gap: 4px; }
.item b { font-size: 15px; overflow-wrap: anywhere; }
.item small { color: var(--mute); overflow-wrap: anywhere; }
.tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--chip); color: var(--mute); }
.tag.sample { background: #fff3bf; color: #664d03; }
.note { background: var(--card); border: 1px solid var(--line); border-left: 4px solid #f59f00; border-radius: 10px; padding: 12px 14px; margin: 8px 0 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.note span { flex: 1; min-width: 200px; }
.empty { text-align: center; color: var(--mute); padding: 48px 16px; border: 1px dashed var(--line); border-radius: 14px; }
.sheet-bg { position: fixed; inset: 0; background: rgba(8,10,14,.55); z-index: 20; display: none; align-items: flex-end; justify-content: center; }
.sheet-bg.open { display: flex; }
.sheet { background: var(--bg); width: 100%; max-width: 620px; max-height: 94vh; border-radius: 18px 18px 0 0; display: flex; flex-direction: column; }
@media (min-width: 700px) { .sheet-bg { align-items: center; } .sheet { border-radius: 18px; max-height: 90vh; } }
.sheet header { padding: 14px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); }
.sheet header h3 { margin: 0; font-size: 17px; flex: 1; }
.sheet form { overflow-y: auto; padding: 14px 16px; display: grid; gap: 14px; }
.sheet footer { padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); display: flex; gap: 10px; }
.sheet footer .btn.primary { flex: 1; }
.f label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; }
.f .help { color: var(--mute); font-size: 12px; margin-top: 4px; }
.f textarea { min-height: 110px; resize: vertical; }
.f .row { display: flex; gap: 10px; align-items: center; }
.f input[type=color] { width: 56px; height: 42px; padding: 3px; flex: none; }
.f input[type=checkbox] { width: 22px; height: 22px; }
.media { display: grid; gap: 8px; }
.media .prev { border-radius: 10px; overflow: hidden; background: var(--chip); }
.media .prev img, .media .prev video { display: block; max-width: 100%; max-height: 240px; margin: 0 auto; }
.media .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.bar-prog { height: 6px; background: var(--chip); border-radius: 99px; overflow: hidden; }
.bar-prog i { display: block; height: 100%; width: 0; background: var(--brand); transition: width .15s; }
#toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 11px 16px; border-radius: 10px; z-index: 40; max-width: 92vw; display: none; box-shadow: var(--shadow); }
#toast.bad { background: var(--bad); color: #fff; }
.ended { text-align: center; padding: 60px 20px; }
</style>
</head>
<body>
<header class="top"><h1 id="title">Admin</h1><span class="badge">Admin</span></header>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<main id="main"><p class="empty">Loading…</p></main>
<div class="sheet-bg" id="sheetbg"><div class="sheet" role="dialog" aria-modal="true" id="sheet"></div></div>
<div id="toast" role="status"></div>
<script>
"use strict";
const base = location.pathname.replace(/\/+$/, "");           // /admin-app/<app>/<session>
const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") el.className = v; else if (k.startsWith("on")) el.addEventListener(k.slice(2), v); else if (v === true) el.setAttribute(k, ""); else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(String(k)));
  return el;
};
let schema = null, col = null, items = {}, q = "";

function toast(text, bad = false) {
  const t = $("#toast"); t.textContent = text; t.className = bad ? "bad" : ""; t.style.display = "block";
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.style.display = "none"; }, bad ? 7000 : 2600);
}
function ended() {
  $("#main").replaceChildren(h("div", { class: "ended" }, h("h2", {}, "This admin session has ended"), h("p", {}, "Go back to Manage app and tap Open admin again.")));
  $("#tabs").replaceChildren();
}
async function call(path, opts = {}) {
  let r;
  try { r = await fetch(base + path, opts); } catch { throw new Error("No connection. Check your internet and try again."); }
  if (r.status === 403 && path !== "/schema") { ended(); throw new Error("This admin session has ended."); }
  let data = null; try { data = await r.json(); } catch { /* not JSON */ }
  if (!r.ok) throw new Error((data && (data.error || data.detail)) || `Something went wrong (HTTP ${r.status}).`);
  return data;
}
const titleOf = (c, it) => String(it[c.title] ?? it.name ?? it.title ?? it.id ?? "Untitled");
const fieldOf = (c, type) => c.fields.find((f) => f.type === type);
function show(f, v) {
  if (v === "" || v == null) return "";
  if (f.type === "toggle") return v ? "Yes" : "No";
  if (f.type === "price") return Number(v).toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  return String(v);
}

async function load(c) {
  col = c; q = "";
  render();
  try { const d = await call(`/api/${c.name}`); items[c.name] = Array.isArray(d) ? d : d.items || []; }
  catch (e) { if (!/ended/.test(e.message)) toast(e.message, true); items[c.name] = items[c.name] || []; }
  render();
}

function render() {
  $("#tabs").replaceChildren(...schema.collections.map((c) => h("button", { "aria-current": String(c === col), onclick: () => load(c) }, c.label, items[c.name] ? h("span", { class: "n" }, items[c.name].length) : null)));
  const list = items[col.name], main = $("#main");
  if (!list) { main.replaceChildren(h("p", { class: "empty" }, "Loading…")); return; }
  const needle = q.trim().toLowerCase();
  const shown = needle ? list.filter((it) => JSON.stringify(it).toLowerCase().includes(needle)) : list;
  const samples = list.filter((it) => it.sample);
  const pic = fieldOf(col, "image") || fieldOf(col, "video");
  const search = h("input", { type: "search", placeholder: "Search", value: q, "aria-label": "Search", oninput: (e) => { q = e.target.value; render(); $("input[type=search]").focus(); } });
  main.replaceChildren(
    h("div", { class: "bar" }, h("h2", {}, col.label), list.length > 6 ? search : null, h("button", { class: "btn primary", onclick: () => edit(null) }, "+ Add")),
    samples.length ? h("div", { class: "note" }, h("span", {}, `${samples.length} sample ${samples.length === 1 ? "entry" : "entries"} came with your app. Edit them to make them yours, or delete them.`),
      h("button", { class: "btn danger", onclick: () => removeSamples(samples) }, "Delete all samples")) : null,
    shown.length ? h("div", { class: "grid" }, shown.map((it) => card(it, pic))) :
      h("div", { class: "empty" }, list.length ? "Nothing matches your search." : `No ${col.label.toLowerCase()} yet. Tap “+ Add” to create the first one.`));
}

function card(it, pic) {
  const v = pic && it[pic.key];
  const thumb = h("div", { class: "pic" }, v ? (pic.type === "video" ? h("video", { src: v, muted: true, preload: "metadata" }) : h("img", { src: v, alt: "", loading: "lazy" })) : "No picture");
  const meta = col.fields.filter((f) => f.key !== col.title && !["longtext", "image", "video", "file", "color"].includes(f.type) && it[f.key] !== "" && it[f.key] != null).slice(0, 3)
    .map((f) => `${f.label}: ${show(f, it[f.key])}`).join(" · ");
  return h("button", { class: "item", onclick: () => edit(it) }, pic ? thumb : null,
    h("div", { class: "body" }, h("b", {}, titleOf(col, it)), meta ? h("small", {}, meta) : null, it.sample ? h("span", { class: "tag sample" }, "Sample") : null));
}

function control(f, value, state) {
  const set = (v) => { state[f.key] = v; };
  const id = "f_" + f.key;
  if (f.type === "longtext") return h("textarea", { id, oninput: (e) => set(e.target.value) }, value ?? "");
  if (f.type === "toggle") return h("div", { class: "row" }, h("input", { id, type: "checkbox", checked: !!value, onchange: (e) => set(e.target.checked) }), h("span", {}, "On"));
  if (f.type === "select") return h("select", { id, onchange: (e) => set(e.target.value) }, h("option", { value: "" }, "Choose…"), (f.options || []).map((o) => h("option", { value: o, selected: o === value }, o)));
  if (f.type === "color") return h("div", { class: "row" }, h("input", { id, type: "color", value: /^#[0-9a-f]{6}$/i.test(value || "") ? value : "#3b5bdb", oninput: (e) => set(e.target.value) }));
  if (["image", "video", "file"].includes(f.type)) return mediaControl(f, value, state);
  const type = { number: "number", price: "number", date: "date", url: "url" }[f.type] || "text";
  const el = h("input", { id, type, value: value ?? "", step: f.type === "price" ? "0.01" : f.type === "number" ? "any" : null, inputmode: f.type === "price" || f.type === "number" ? "decimal" : null,
    oninput: (e) => set(["number", "price"].includes(f.type) ? (e.target.value === "" ? "" : Number(e.target.value)) : e.target.value) });
  return el;
}

function mediaControl(f, value, state) {
  const box = h("div", { class: "media" }), prev = h("div", { class: "prev" }), prog = h("div", { class: "bar-prog", style: "display:none" }, h("i")), url = h("input", { type: "url", placeholder: "Or paste a web address", value: value ?? "" });
  const accept = f.type === "image" ? "image/*" : f.type === "video" ? "video/*" : "image/*,video/*,audio/*,application/pdf";
  const pick = h("input", { type: "file", accept, style: "display:none" });
  const draw = () => {
    const v = state[f.key]; prev.replaceChildren();
    if (!v) { prev.style.display = "none"; return; }
    prev.style.display = "block";
    prev.append(f.type === "video" || /\.(mp4|webm|mov)$/i.test(v) ? h("video", { src: v, controls: true, playsinline: true, preload: "metadata" }) :
      f.type === "image" || /\.(jpe?g|png|webp|gif)$/i.test(v) ? h("img", { src: v, alt: "" }) : h("a", { href: v, target: "_blank", rel: "noopener" }, v));
    url.value = v;
  };
  const upload = (file) => new Promise((resolve, reject) => {
    const x = new XMLHttpRequest(); x.open("POST", base + "/upload"); x.setRequestHeader("X-Filename", encodeURIComponent(file.name));
    prog.style.display = "block";
    x.upload.onprogress = (e) => { if (e.lengthComputable) $("i", prog).style.width = (100 * e.loaded / e.total) + "%"; };
    x.onload = () => { prog.style.display = "none"; let d = {}; try { d = JSON.parse(x.responseText); } catch { /* */ } x.status === 200 ? resolve(d.url) : reject(new Error(d.error || d.detail || `Upload failed (HTTP ${x.status}).`)); };
    x.onerror = () => { prog.style.display = "none"; reject(new Error("The upload was interrupted. Check your internet and try again.")); };
    x.send(file);
  });
  pick.onchange = async () => {
    const file = pick.files[0]; if (!file) return;
    try { state[f.key] = await upload(file); draw(); toast("Uploaded"); } catch (e) { toast(e.message, true); }
    pick.value = "";
  };
  url.oninput = () => { state[f.key] = url.value.trim(); if (/^https?:\/\//i.test(url.value)) draw(); };
  box.append(prev, h("div", { class: "acts" }, h("button", { type: "button", class: "btn", onclick: () => pick.click() }, f.type === "image" ? "Upload picture" : f.type === "video" ? "Upload video" : "Upload file"),
    h("button", { type: "button", class: "btn", onclick: () => { state[f.key] = ""; url.value = ""; draw(); } }, "Remove")), prog, url, pick);
  draw();
  return box;
}

function edit(it) {
  const state = {}, isNew = !it;
  for (const f of col.fields) state[f.key] = it ? it[f.key] ?? (f.type === "toggle" ? false : "") : (f.type === "toggle" ? true : "");
  const form = h("form", { onsubmit: (e) => { e.preventDefault(); save(); } },
    col.fields.map((f) => h("div", { class: "f" }, h("label", { for: "f_" + f.key }, f.label + (f.required ? " *" : "")), control(f, state[f.key], state), f.help ? h("div", { class: "help" }, f.help) : null)));
  const saveBtn = h("button", { class: "btn primary", type: "button", onclick: () => save() }, isNew ? "Add" : "Save changes");
  const close = () => $("#sheetbg").classList.remove("open");
  async function save() {
    const miss = col.fields.find((f) => f.required && (state[f.key] === "" || state[f.key] == null));
    if (miss) { toast(`${miss.label} is needed.`, true); return; }
    const body = { ...state }; if (it && it.sample) body.sample = false;
    saveBtn.disabled = true; saveBtn.textContent = "Saving…";
    try {
      const saved = isNew ? await call(`/api/${col.name}`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) })
                          : await call(`/api/${col.name}/${encodeURIComponent(it.id)}`, { method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
      const row = saved && typeof saved === "object" ? { ...(it || {}), ...body, ...saved } : { ...(it || {}), ...body };
      const list = items[col.name]; const i = it ? list.findIndex((x) => x.id === it.id) : -1;
      if (i >= 0) list[i] = row; else list.unshift(row);
      close(); render(); toast(isNew ? "Added" : "Saved");
    } catch (e) { toast(e.message, true); saveBtn.disabled = false; saveBtn.textContent = isNew ? "Add" : "Save changes"; }
  }
  async function del() {
    if (!confirm(`Delete “${titleOf(col, it)}”? This cannot be undone.`)) return;
    try { await call(`/api/${col.name}/${encodeURIComponent(it.id)}`, { method: "DELETE" }); items[col.name] = items[col.name].filter((x) => x.id !== it.id); close(); render(); toast("Deleted"); }
    catch (e) { toast(e.message, true); }
  }
  $("#sheet").replaceChildren(
    h("header", {}, h("h3", {}, (isNew ? "Add to " : "Edit ") + col.label.toLowerCase()), h("button", { class: "btn", type: "button", onclick: close, "aria-label": "Close" }, "Close")),
    form, h("footer", {}, it ? h("button", { class: "btn danger", type: "button", onclick: del }, "Delete") : null, saveBtn));
  $("#sheetbg").classList.add("open");
}

async function removeSamples(list) {
  if (!confirm(`Delete all ${list.length} sample entries? Entries you edited are kept.`)) return;
  let done = 0;
  for (const it of list) {
    try { await call(`/api/${col.name}/${encodeURIComponent(it.id)}`, { method: "DELETE" }); items[col.name] = items[col.name].filter((x) => x.id !== it.id); done++; }
    catch (e) { toast(e.message, true); break; }
  }
  render(); if (done) toast(`${done} deleted`);
}
$("#sheetbg").addEventListener("click", (e) => { if (e.target.id === "sheetbg") e.target.classList.remove("open"); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("#sheetbg").classList.remove("open"); });

(async () => {
  try { schema = await call("/schema"); } catch (e) { $("#main").replaceChildren(h("div", { class: "ended" }, h("h2", {}, "Can't open the admin"), h("p", {}, e.message))); return; }
  document.title = (schema.title || schema.app + " admin");
  $("#title").textContent = schema.title || `${schema.app} admin`;
  schema.collections.forEach((c) => { items[c.name] = null; });
  load(schema.collections[0]);
})();
</script>
</body>
</html>
